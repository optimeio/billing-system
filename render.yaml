# Render Blueprint - Billing System Backend
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: billing-system-api
    env: node
    region: oregon
    plan: free
    buildCommand: npm install --prefix frontend && npm run build --prefix frontend && cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5002
      - key: MONGODB_URI
        sync: false  # Set manually in Render dashboard
      - key: JWT_SECRET
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: FRONTEND_URL
        value: https://billing.thesmgroups.com
